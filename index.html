<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="script.js" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="enter city name" spellcheck="false" />
        <button><img src="weather-app-img/search.png" /></button>
      </div>
      <div class="weather">
        <img src="weather-app-img/rain.png" class="weather-icon" />
        <h1 class="temp">22°c</h1>
        <h2 class="city">New York</h2>
        <div class="details">
          <div class="col">
            <img src="weather-app-img/humidity.png" />
            <div>
              <p class="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <img src="weather-app-img/wind.png" />
            <div>
              <p class="wind">15km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const apiKey = "657eb8d31adb40148c3152524262210";
      const apiUrl =
        "https://api.weatherapi.com/v1/current.json?key=657eb8d31adb40148c3152524262210&q=Lucknow&aqi=yes";

      async function checkWeather() {
        const response = await fetch(apiUrl + `&appid=${apikey}`);
        var data = await response.json();
        console.log(data);
      }

      checkWeather();
    </script>
  </body>
</html>
